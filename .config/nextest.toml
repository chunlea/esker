# Test groups for `cargo nextest`, which `just check` uses when it is installed.
#
# WHY THIS FILE EXISTS. A handful of test binaries in this workspace start **whole clusters** — a
# placement driver, four stores with real Raft groups over real sockets, and a SQL node — and
# nextest runs every test in its own process, in parallel, up to the core count. Ten of those at
# once is forty Raft peers heart-beating on 25 ms ticks on one machine, and what that produces is
# not a failed assertion about the system: it is a leader missing a heartbeat because the machine
# is saturated, a follower campaigning, and an in-flight proposal's leader stepping down under it.
#
# `docs/plans/phase-9-rails.md` §8 is the register of exactly that, with three sightings and two
# distinct mechanisms — a 30-second RPC deadline that expires, and an election gap that does not.
# Both were diagnosed as "however many test binaries this machine is running at once", and both
# were then worked around inside the tests, with retries. This is the other half of that answer,
# and the cheaper one: **do not run them at once.**
#
# What is NOT here is a global concurrency limit. Every other test in this workspace is a unit
# test that finishes in milliseconds, and slowing 470 of them down to protect ten would be paying
# the wrong cost.
#
# **EVERY GROUP IN THIS FILE ONLY BINDS `cargo nextest`.** `just check` and the gate run
# `cargo nextest run --workspace --all-features --no-fail-fast`, which reads this file; plain
# `cargo test` does not read it and never has. Under `cargo test` a binary's tests are threads in
# one process rather than processes, all of them at once, and nothing here slows them down. So a
# test whose correctness needs the serialisation must also carry it in its own code — that is what
# `statement_cancellation`'s `static CLOCK: Mutex<()>` is for, and its override below says so at
# length. For the cluster binaries the serialisation is not a correctness requirement but a
# *contention* one: run 20 clusters at once under `cargo test` and you get the flake this file
# exists to remove, which is the standing reason the gate runs nextest and not `cargo test`.

[test-groups.cluster]
# One cluster at a time. Not two: the point is the absence of contention between them, and a
# second is enough to reintroduce it — the differential's four clusters landing beside the joint
# gate's six is what made this file necessary.
max-threads = 1

[[profile.default.overrides]]
# The binaries that start a placement driver **and** several stores with real Raft groups. Named
# rather than pattern-matched, so that a new one is a deliberate addition: a test that belongs in
# this group and is not in it fails intermittently and blames the system.
#
# `esker-pd`'s own tests are not here. They drive a placement driver in process against store
# heartbeats they synthesise, so they run no consensus and cost no ticks.
#
# `esker-cli`'s are, and they are the heaviest of all: they start the cluster as **real
# processes**, so a store there costs an operating-system process rather than a task, and their
# deadlines are wall-clock budgets rather than assertions about a state.
#
# **Four more `esker-sql` binaries, measured rather than guessed.** They share
# `tests/cluster/mod.rs` — three stores, three regions, real sockets, all in process — with
# `joint_gate` and `routing_differential`, which were already here, and they were in no group at
# all. Five tests across them failed together in one full-workspace run and every one passed
# alone; the wall clocks are the argument, not the pass:
#
# ```text
# esker-sql::redrive_live          106.9 s in the run    1.4 s alone
# esker-sql::routing_differential   63.6 s               0.8 s
# esker-sql::real_backend           24.4 s               0.4 s
# esker-sql::real_corpus            19.5 s               4.1 s
# ```
#
# `redrive_live` at 76x is worse than any of the real-process binaries below, and it starts no
# process — which is what says this group, and not the exclusivity override, is the right home:
# the cost is Raft ticks competing with each other, and one at a time is the whole fix. They are
# **deliberately not** given `threads-required` for the reason the next override states.
#
# **Eight more, and the way to find them is written down here because naming them by hand leaked.**
# `esker-sql::composite` failed a full gate at **21.043 s** on
# `OutcomeUnknown("the TxnPrewrite may or may not have been applied: timed out: the deadline passed
# before the peer answered")` — an RPC deadline, not a wrong answer — and ran in **0.076 s** alone.
# It calls `Cluster::start()` like every binary above it and was in no group, which is exactly the
# failure this comment predicted: "a test that belongs in this group and is not in it fails
# intermittently and blames the system."
#
# So the membership question was asked of the whole directory rather than of the one that broke:
#
# ```sh
# grep -l '^mod cluster;' crates/esker-sql/tests/*.rs
# ```
#
# **That grep is the corrected one, and the correction is the third leak this file has recorded.**
# It used to read `grep -l 'cluster::Cluster'`, which is a *use site* and not the mechanism: three
# binaries take the harness apart instead of taking its type — `use cluster::{Session, TENANT}` —
# and were invisible to it. `joint_gate` and `routing_differential` were in the filter anyway,
# having been added by hand before the census existed, so the miss was silent until h1 added
# `multi_region_rows`, which the census could not see and nobody added by hand. It reddened a gate
# at **21.0 s** on `OutcomeUnknown` from a `TxnPrewrite` deadline and passed alone, which is the
# same signature, on the same mechanism, as `composite` one paragraph above. What identifies a
# member is *sharing `tests/cluster/mod.rs`* — three stores with real Raft groups over real
# sockets — so the census asks for the `mod` and not for a name inside it.
#
# Seventeen binaries today, all seventeen listed. `view_bind_real_stores` joins in the same pass:
# it holds the same three stores, was equally invisible, and had no sighting only because it holds
# them briefly. `store_locking` joins too, and its exclusion is a mistake this file argued itself
# into: its own override at the bottom takes the whole runner for the one test that *measures*
# contention, and that was read as settling the binary. It does not — the other eight hold three
# real stores each and were load on every member of this group while staying outside it, which is
# exactly the "a non-member causes the contention" paragraph below. Both settings apply to it now:
# `test-group` from here, `threads-required` from there.
#
# **A name is not the membership rule, in the other direction too.** `fragment_route_repair` looks
# like a member and is not one: it drives a `MemoryBackend` and a hand-written `FragmentSource`, so
# it starts no store, holds no region and costs no tick. Same for `esker-store::multi_region` and
# `retire_crash_kill`, which serve no RPC at all. Do not add a test to this group because its name
# says cluster; run the grep.
#
# And a non-member does
# not only suffer the contention — it **causes** it, because this group bounds its members
# against each other and not against the rest of the run, so each one left out is load on the
# ones that are in. Only `composite` has a
# sighting; the other seven join on the **mechanism** — they hold three stores with real Raft
# groups over real sockets, which is the whole membership rule — and on the cost of being wrong
# about them, which is measured and is nothing:
#
# ```text
# all 27 tests across the eight, run alone, together   0.328 s
# the slowest single test among them                   0.314 s
# ```
#
# A third of a second of serial time against a 21-second red. Run that `grep` when adding a test
# that starts a cluster.
#
# **`priority` is the other half, and it is the half that grouping cannot do.** `max-threads = 1`
# bounds these binaries against *each other* and against nothing else, which the paragraph above
# says out loud — so a member still runs beside whatever else the runner has scheduled, and on this
# machine that is up to four thousand other tests. The evidence is that most of this group's reds
# happened *inside* it: `promotion`'s `under_load`, `multi_region_differential`, `snapshot`'s two,
# `composite` — all members when they failed. Serialising them was necessary and is not sufficient.
#
# A negative priority puts them at the back of the queue, so the chain of clusters runs on a
# machine the rest of the suite has already left. It costs wall clock — the chain no longer
# overlaps the fast tests, so the run is the rest *plus* the chain rather than the longer of the
# two — and buys the thing that costs more: a rerun. Every gate tonight lost 5-8 minutes to one,
# and a rerun is not only its own wall clock, it is a gate whose red nobody trusts.
#
# **What is verified, and what is not.** `cargo nextest show-config test-groups` was run against
# this file in the Linux container and reports what nextest itself computed, which is the check
# that a filter of thirty `binary()` predicates needs:
#
# ```text
# group: cluster (max threads = 1)     29 binaries, 122 tests
# group: timed   (max threads = 1)      1 binary,     8 tests
# ```
#
# (`esker-cli::columnar_cluster` is the thirtieth name in the filter and lists no test because its
# one test is `#[ignore]`d — a member, not a stale name.) The **wall-clock cost of `priority` is
# not measured**, and deliberately: the box was at load 16 with another lane's container on it, so
# a serial run there would have measured the box. That is the same reason the `esker-store` note
# above gives for not running a load experiment, and the same answer — the next gate's wall clock
# is the measurement. The two halves are independent, so if that number is worse than a rerun is,
# delete this one line and the membership above still stands on its own.
#
# **A typo in a key here is a warning and not an error**, which is worth knowing before trusting
# any of the above: nextest rejects an out-of-range value (`priority = -2000` fails to parse,
# "expected a signed 8 bit integer") but only *warns* on a key it does not know
# ("ignoring unknown configuration key"). So `priority` was proved to be read by giving it a value
# it must reject, not by the run being green. Do that for any key added here.
#
# **`esker-store::snapshot` joined on the same argument, and on two sightings rather than one.** It
# holds regions like its neighbours `promotion` and `balance`, and it was the only member of that
# family left out. Two different tests in it have now stretched by the same factor in two different
# gates, each green alone:
#
# ```text
# a_snapshot_replacing_a_held_region_routes_through_a_retire   61.5 s loaded   0.647 s alone
# a_held_region_is_retired_even_after_the_office_has_moved     60.7 s loaded   0.83-1.21 s alone (3/3)
# ```
#
# ~60 s against under a second is starvation and not a race — a race takes the same time in both
# outcomes, which is how `store_locking`'s red was told apart from these. No load experiment was
# run for this: the gate lock prevents the contention the change addresses, so a before/after under
# it measures nothing (that was learned the expensive way in v47). The proof is later gates
# staying green.
#
# **Then the same census was run on `esker-store`, and it found the textbook member missing.**
# `promotion`, `balance` and `snapshot` were listed because each had a sighting; nobody had asked
# which *other* binaries in that crate hold regions. Four do, and their own headlines are the
# argument — this rule is not read off the code, it is read off the first line of each file:
#
# ```text
# esker-store::cluster    "Three stores, one region, real TCP … three real servers on ephemeral
#                          ports, and Raft electing a leader among them with no help."
# esker-store::retire      region data after RemovePeer: 5 stores across 4 tests, 13 peer sites
# esker-store::pd_wire    "a real server on a real port" for PD, reaching a Raft proposal
# esker-store::sim_sweep  "replays each case against a real two-store cluster"
# ```
#
# `esker-store::cluster` is the plainest cluster test in the workspace and was in no group at all,
# which is worth stating because of what it implies about the census: the reason it never appeared
# is that it never failed, and a member is identified by what it *starts*, not by whether it has
# reddened yet. The four have no sightings and join on the mechanism, at a measured cost recorded
# below.
#
# **Deliberately still out, so the next census does not churn on them.** `server`, `txnkv`,
# `reclaim_range` and `schema_fetch` each hold one store on one socket: the sockets cost nothing
# and there is no consensus among peers to starve, which is the whole mechanism. `sim_snapshot_ask`
# holds one store too, but note that its subject is *when* an answer arrives — "not a member, on
# sight" against "not applied here, after the wait" — so if it ever reds it belongs in `timed`
# below and not here.
#
filter = """
    (package(esker-sql) and (binary(joint_gate) or binary(routing_differential) or binary(pd_wiring)
        or binary(real_backend) or binary(real_corpus) or binary(redrive_live)
        or binary(case_insensitive_probe) or binary(collation) or binary(composite)
        or binary(derived_name_in_a_schema) or binary(enum_default) or binary(jsonb_concat)
        or binary(psql_smoke) or binary(regtype_user_probe)
        or binary(multi_region_rows) or binary(view_bind_real_stores) or binary(store_locking)))
    or (package(esker-store) and (binary(promotion) or binary(balance) or binary(snapshot)
        or binary(cluster) or binary(retire) or binary(pd_wire) or binary(sim_sweep)))
    or (package(esker-cli) and (binary(cluster_start) or binary(cluster_chaos) or binary(columnar_cluster) or binary(pgwire_cluster) or binary(cross_region_scan) or binary(multi_region_differential)))
"""
test-group = 'cluster'
priority = -20

[[profile.default.overrides]]
# **The real-process ones run alone against the whole workspace, not just against each other.**
#
# The group above serialises this set internally, and that is not enough: each of these starts a
# placement driver, up to four stores and a SQL node as **operating-system processes**, so while one
# runs it is competing with the other three thousand tests for the machine — and it is the *other*
# tests that lose. Three consecutive gates, three different reds, each green alone:
#
# ```text
# esker-cli::cross_region_scan                     FAIL in gate, 2/2 alone
# esker-cli::multi_region_differential             FAIL in gate, 2/2 alone
# esker-pd::failover a_membership_report…          FAIL in gate (0.142 s), 3/3 alone
# ```
#
# The last one is the argument: it is an **in-process** test in a crate none of those binaries
# touch, so the coupling is the machine and nothing narrower. A test that fails for that reason
# teaches whoever reads the gate to distrust the gate, which costs more than the minutes this
# saves.
#
# `threads-required` set to the run's thread count is nextest's way to say "this one occupies the
# runner": it takes every slot, so nothing else is scheduled beside it. Not applied to the
# in-process members of the group above — `joint_gate`, `promotion` and the rest hold Raft groups
# in threads and cost ticks, not processes, and making them exclusive too would pay a large bill
# for a smaller share of the problem.
filter = 'package(esker-cli) and (binary(cluster_start) or binary(cluster_chaos) or binary(columnar_cluster) or binary(pgwire_cluster) or binary(cross_region_scan) or binary(multi_region_differential))'
threads-required = 'num-test-threads'

[test-groups.timed]
# One at a time, and separate from `cluster` because the cost is different: these start no
# processes and hold no Raft groups, they **measure**. A cancellation that must be observed within
# a bound, a sleep that must not return early, a `lock_timeout` that must fire before a holder
# releases — every one of them is a claim about *when*, and a box running three thousand other
# tests beside them is a box where "when" moves.
max-threads = 1

[[profile.default.overrides]]
# The binary whose whole subject is timing. It failed 3 of 8 under a parallel suite and 8 of 8
# twice in a quiet quarter-second, which is the signature: not a race in the product, a claim about
# elapsed time competing with fifty other processes for the clock it is reading.
#
# Serialising them is not hiding the flake — the waits inside them are on events and the bounds
# have been widened to hold under load. It is refusing to measure a stopwatch in a scrum.
#
# **This group is only half the contract, because it only binds `cargo nextest`.** Under plain
# `cargo test` those eight are threads in one process rather than eight processes, and they raced
# each other: measured on an idle machine, **two of three runs failed, at 20.00s — a hang, not a
# near miss**. So the binary also holds a `static CLOCK: Mutex<()>` and every test takes it
# (`tests/statement_cancellation.rs`, `alone()`). The two halves do not overlap — nextest gives
# each test its own process, where that mutex is uncontended and free — and the guard is what makes
# the file honest for whoever runs `cargo test` without reading this file. Five runs green at
# 0.71s with it.
filter = 'package(esker-sql) and binary(statement_cancellation)'
test-group = 'timed'

[[profile.default.overrides]]
# **A contention measurement is invalid on a contended box**, which is the same argument as the
# group above and needs the stronger knob.
#
# `concurrent_increments_do_not_lose_one_against_real_stores` counts *spurious* `40001`s — the ones
# a missing statement re-check causes — by asserting there are none. Eight writers on one row on a
# **saturated** machine raise real ones, so under a full gate the test measures the box and reports
# it as the defect. Seen green in one gate and red in the next on the same commit, and 4/4 alone.
#
# Its own doc used to claim it never false-reds; that was four runs on an idle machine written up as
# a property, and it is corrected. What is left is this: the experiment needs the machine, so it
# takes the machine. `threads-required` rather than the group, because the group only serialises
# members against each other and the load here is the other three thousand tests.
#
# Named by test rather than by binary: `store_locking`'s other eight are ordinary and stay parallel.
filter = 'package(esker-sql) and test(concurrent_increments_do_not_lose_one_against_real_stores)'
threads-required = 'num-test-threads'
