# Test groups for `cargo nextest`, which `just check` uses when it is installed.
#
# WHY THIS FILE EXISTS. A handful of test binaries in this workspace start **whole clusters** — a
# placement driver, four stores with real Raft groups over real sockets, and a SQL node — and
# nextest runs every test in its own process, in parallel, up to the core count. Ten of those at
# once is forty Raft peers heart-beating on 25 ms ticks on one machine, and what that produces is
# not a failed assertion about the system: it is a leader missing a heartbeat because the machine
# is saturated, a follower campaigning, and an in-flight proposal's leader stepping down under it.
#
# `docs/plans/phase-9-rails.md` §8 is the register of exactly that, with three sightings and two
# distinct mechanisms — a 30-second RPC deadline that expires, and an election gap that does not.
# Both were diagnosed as "however many test binaries this machine is running at once", and both
# were then worked around inside the tests, with retries. This is the other half of that answer,
# and the cheaper one: **do not run them at once.**
#
# What is NOT here is a global concurrency limit. Every other test in this workspace is a unit
# test that finishes in milliseconds, and slowing 470 of them down to protect ten would be paying
# the wrong cost.

[test-groups.cluster]
# One cluster at a time. Not two: the point is the absence of contention between them, and a
# second is enough to reintroduce it — the differential's four clusters landing beside the joint
# gate's six is what made this file necessary.
max-threads = 1

[[profile.default.overrides]]
# The binaries that start a placement driver **and** several stores with real Raft groups. Named
# rather than pattern-matched, so that a new one is a deliberate addition: a test that belongs in
# this group and is not in it fails intermittently and blames the system.
#
# `esker-pd`'s own tests are not here. They drive a placement driver in process against store
# heartbeats they synthesise, so they run no consensus and cost no ticks.
#
# `esker-cli`'s are, and they are the heaviest of all: they start the cluster as **real
# processes**, so a store there costs an operating-system process rather than a task, and their
# deadlines are wall-clock budgets rather than assertions about a state.
filter = """
    (package(esker-sql) and (binary(joint_gate) or binary(routing_differential) or binary(pd_wiring)))
    or (package(esker-store) and (binary(promotion) or binary(balance)))
    or (package(esker-cli) and (binary(cluster_start) or binary(cluster_chaos) or binary(columnar_cluster) or binary(pgwire_cluster)))
"""
test-group = 'cluster'

[test-groups.timed]
# One at a time, and separate from `cluster` because the cost is different: these start no
# processes and hold no Raft groups, they **measure**. A cancellation that must be observed within
# a bound, a sleep that must not return early, a `lock_timeout` that must fire before a holder
# releases — every one of them is a claim about *when*, and a box running three thousand other
# tests beside them is a box where "when" moves.
max-threads = 1

[[profile.default.overrides]]
# The binary whose whole subject is timing. It failed 3 of 8 under a parallel suite and 8 of 8
# twice in a quiet quarter-second, which is the signature: not a race in the product, a claim about
# elapsed time competing with fifty other processes for the clock it is reading.
#
# Serialising them is not hiding the flake — the waits inside them are on events and the bounds
# have been widened to hold under load. It is refusing to measure a stopwatch in a scrum.
filter = 'package(esker-sql) and binary(statement_cancellation)'
test-group = 'timed'
