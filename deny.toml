# Dependency policy enforcement for the pure-Rust rule in CLAUDE.md.
#
# Esker is 100% Rust. No crate that compiles C, C++ or assembly may appear anywhere in the
# runtime dependency graph, including transitively. This file is one half of that guard; the
# other half is crates/esker-cli/tests/dep_budget.rs, which counts the graph and checks names
# against the same patterns. Both exist because they fail differently: cargo-deny catches a
# crate we already know about, the test catches a shape we have not seen yet.
#
# The transitive runtime crate budget. The test reads this line, so keep the format exact.
# Lowering it is welcome; raising it needs an ADR (docs/adr/0003-dependencies.md). It came down
# from 40 when `crossbeam-skiplist` left, taking `crossbeam-epoch` and `crossbeam-utils` with it
# (docs/adr/0041-the-in-house-arena-skiplist.md) -- three crates removed, three off the budget, so
# the headroom below is the same as it was.
# esker-dep-budget = 37
#
# **This number is about the default feature set, which is the only one the test measures.**
# `esker-sql`'s `tls` feature (ADR 0055, off by default) adds nine crates when it is on — rustls,
# rustls-graviola, graviola, rustls-pki-types, rustls-webpki, getrandom, subtle, untrusted,
# zeroize — taking the compiled graph from 34 to 43. Nothing enforces a budget in that state, and
# two things would have to be fixed before anything could:
#
#   * `dep_budget.rs` walks `resolve.nodes[].deps` without cross-referencing
#     `resolve.nodes[].features`, so it counts optional dependencies that are never compiled. It
#     reports 36 for the default set that `cargo tree -e normal` puts at 34.
#   * Worse, `rustls-webpki` *declares* an optional `ring` — unused, never built, and not in
#     `cargo tree` or in cargo-deny's graph — which that same walk would report as a banned crate
#     the moment the feature was measured. A false positive, in the one test whose job is to have
#     no false negatives.
#
# Both live in `crates/esker-cli/`, which ADR 0055's lane does not own; they are written down in
# that ADR as owed work rather than fixed here.
#
# **`ring` and `cc` are named in `Cargo.lock`, and nothing builds them.** Cargo's lock file records
# a version for every optional dependency edge that *could* be selected, activated or not, so
# `rustls-webpki`'s unused optional `ring` — and `ring`'s own `cc` and `windows-*` — appear there
# the moment rustls is in the manifest. Three independent checks say they are not in the graph:
# `cargo tree --features esker-sql/tls --target all -e normal,build,dev -i ring` prints nothing,
# `rustls-webpki`'s activated features are `["alloc", "std"]`, and `cargo deny check` (whose graph
# is built by `krates`, not by this file) reports `bans ok`. A grep of `Cargo.lock` is not a
# measurement of the dependency graph; these three are.

[graph]
# The two platforms CI builds. Without this, cargo-deny would also consider the Windows
# dependency tree, which nothing here is built for.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
# The pure-Rust rule is about what we ship. Test-only tools (proptest, criterion) may pull in
# whatever they like -- proptest depends on `rand`, which is banned at runtime.
exclude-dev = true
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The allow list is forward-looking: an entry nobody uses yet is not a problem, a crate whose
# licence is missing from it is.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# A build script is how C ends up in a "pure Rust" graph, so anything that has one has to be
# looked at by a human rather than discovered in a profile six months later.
deny = [
    # --- compiles C/C++/assembly, or wraps something that does ---
    { crate = "cc" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "ring" },
    { crate = "aws-lc-rs" },
    { crate = "aws-lc-sys" },
    { crate = "libz-sys" },
    { crate = "libz-ng-sys" },
    { crate = "zstd" },
    { crate = "zstd-safe" },
    { crate = "zstd-sys" },
    { crate = "bzip2-sys" },
    { crate = "lz4-sys" },
    { crate = "librocksdb-sys" },
    # --- the point of the project is to write these ourselves (CLAUDE.md) ---
    { crate = "rocksdb" },
    { crate = "sled" },
    { crate = "openraft" },
    { crate = "raft" },
    { crate = "raft-proto" },
    { crate = "crc32c" },
    { crate = "crc32fast" },
    { crate = "rand" },
    { crate = "lru" },
    { crate = "snap" },
    { crate = "pgwire" },
    # --- hand-rolled framing and formats, never serde or prost (ADR 0002) ---
    { crate = "serde" },
    { crate = "serde_derive" },
    { crate = "prost" },
    { crate = "tonic" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
