[package]
name = "esker-store"
description = "Esker store: one process hosting many regions, the apply loop, splits and snapshots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# The storage this store puts a network in front of.
esker-engine.workspace = true
# The `'r'` namespace every RawKV key is stored under. A client never sends the prefix, so
# this is the only place it is applied (docs/DESIGN.md §3, CLAUDE.md invariant 7).
esker-base.workspace = true
esker-keys.workspace = true
# The columnar apply target (ADR 0022 Decision 1). The first edge into this crate; it shares
# nothing with the row engine but the `FileSystem` trait and `esker-base`.
esker-columnar.workspace = true
# The wire: messages, the typed error, and the Service the server calls.
esker-proto.workspace = true
# Percolator's decisions, records and keys. The store owns none of them: it decodes a request,
# asks this crate what to write, and writes it through Raft (docs/plans/phase-5.md §10).
esker-txn.workspace = true
# Consensus. The store is its driver: it owns the RawNode, performs the writes a `Ready`
# asks for, and enforces the ordering the pure core cannot (docs/DESIGN.md §5).
esker-raft.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Async lives at the network edge only. The store uses `spawn_blocking` to keep the
# synchronous engine off the reactor, and nothing else here is async.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros"] }

[features]
# Exposes `esker_store::pd::FakePd`, the in-memory placement driver the bootstrap and heartbeat
# tests drive. Off by default, on the same reasoning as `esker-client`'s: a normal build carries
# no machinery whose only caller is a test.
testing = []

[dev-dependencies]
# The crate's own test harness, for integration tests that link the library as an ordinary
# dependency and so cannot reach `#[cfg(test)]` code.
esker-store = { path = ".", features = ["testing"] }
# `tests/multi_region.rs` hand-builds the region records a split would leave behind, which means
# writing into the `raft` column family directly. Already a runtime dependency; listed again so
# the integration tests can name it.
esker-engine.workspace = true
# `tests/promotion.rs` drives a **real** placement driver, because the phase-4 acceptance stall was
# a disagreement between PD's scheduler and this store's operator handling that neither side's own
# fake could show. Workspace-internal and dev-only: it adds nothing to the runtime graph or to
# `deny.toml`'s budget, and `esker-pd` does not depend on this crate, so there is no cycle.
esker-pd.workspace = true
# `tests/balance.rs` runs a two-store cluster whose interesting failures are all "something was
# dropped somewhere"; without a subscriber the store's own tracing goes nowhere. Dev-only.
tracing-subscriber.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "time"] }

[lints]
workspace = true
