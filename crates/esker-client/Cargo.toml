[package]
name = "esker-client"
description = "Esker client: region cache, routing, retries and the transaction API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# The frame limit and, once the sibling lane lands them, the wire types themselves. Until
# then `src/wire.rs` is a stand-in for this crate's message layer (see its header).
esker-proto.workspace = true
# The seeded generator the retry jitter draws from; `rand` is banned (ADR 0004).
esker-base.workspace = true
# `Bytes` at API boundaries: a value read out of a response is handed on without a copy.
bytes.workspace = true
thiserror.workspace = true

[features]
# Exposes `esker_client::testing`, the scriptable transport every retry test runs against.
# Off by default, on the same reasoning as `esker-engine`'s: a normal build carries no
# machinery whose job is to fail on purpose.
testing = []

[dev-dependencies]
# The crate's own test harness, for integration tests that link the library as an ordinary
# dependency and so cannot reach `#[cfg(test)]` code.
esker-client = { path = ".", features = ["testing"] }
# `tests/store_model.rs` drives one proptest through both an engine and this client, so the
# two have to be in scope together. Dev-only: nothing the client ships links the engine.
esker-engine.workspace = true
# `tests/store_model.rs` spawns a real server in-process and drives the same proptest through
# it, so the network is in the loop rather than assumed away. Dev-only.
esker-store.workspace = true
# `tests/chaos_linearizability.rs` checks the histories a real three-node cluster produces
# against the register model. DESIGN.md §11 puts that checker in `esker-sim` precisely so that
# phase 3e and phase 5 can both use it. Dev-only.
esker-sim.workspace = true
# `Role`, to ask a store whether it is the one leading right now. Dev-only.
esker-raft.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
