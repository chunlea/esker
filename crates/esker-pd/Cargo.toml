[package]
name = "esker-pd"
description = "Esker placement driver: membership, routing table, TSO and scheduling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# A clock a test can drive, exposed to the integration tests the way `esker-engine`
# exposes its fault-injecting filesystem. A normal build has neither.
testing = []

[dependencies]
# PD keeps its whole state in its own database, default column family only
# (docs/DESIGN.md §7).
esker-engine.workspace = true
# The wire: the Region/Peer/Epoch types the routing table stores, the encoder the
# records are written with, and the typed error every method answers with.
esker-proto.workspace = true
# PD replicates itself: the same pure `RawNode` a region's peer is driven by
# (docs/adr/0055-pd-is-a-raft-group.md). Read-only to this crate — PD drives it and
# adds nothing to it.
esker-raft.workspace = true
# `mix64`, for minting a cluster id out of the one-time facts of a bootstrap.
esker-base.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Async lives at the network edge only: `PdService` hands the synchronous core to
# `spawn_blocking` so that an fsync never stalls the reactor.
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
# The crate's own test clock, enabled for its tests only. An integration test links the
# library as an ordinary dependency, so `#[cfg(test)]` does not reach it and the feature is
# the only way in — the same shape `esker-engine` uses for its fault-injecting filesystem.
esker-pd = { path = ".", features = ["testing"] }
# `tests/sim_balance.rs`: the deterministic model of balance-versus-repair owns the world and the
# checker; this crate supplies the decision. Dev-only, so it is outside the runtime crate budget,
# and `esker-sim` depends on nothing above `esker-raft`, so there is no cycle.
esker-sim = { path = "../esker-sim" }
# `tests/tso_window.rs`: the window's rule under a generator rather than under a script. Dev-only
# and already on the allowlist (docs/adr/0003-dependencies.md).
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt-multi-thread", "macros"] }

[lints]
workspace = true
