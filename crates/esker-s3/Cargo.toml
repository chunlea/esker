[package]
name = "esker-s3"
description = "A minimal S3 client: SigV4 over an in-house HTTP/1.1, for SST tiering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# SHA-256 and HMAC for SigV4, and the PCG32 the retry jitter draws from. Nothing else:
# this crate deliberately costs zero against the runtime budget in deny.toml (ADR 0025).
esker-base.workspace = true
thiserror.workspace = true
tracing.workspace = true
# **Optional, and off by default** (`tls` below). The same two crates and the same provider the
# PostgreSQL port took (ADR 0055, accepted 2026-09-04); this is the second surface, so it costs
# nothing further against the budget. Contained to `src/tls.rs`: a `use rustls::` anywhere else
# in this crate is a review failure, which is the rule `sqlparser` and `pgwire::tls` live by.
rustls = { workspace = true, optional = true }
rustls-graviola = { workspace = true, optional = true }

[features]
# HTTPS to the object store. Off by default, and with it off `Endpoint::parse` refuses an
# `https://` endpoint rather than speaking plaintext to it (ADR 0025's rule, ADR 0055's option 1).
#
# `just check` builds `--all-features`, and features unify across the workspace, so a workspace
# build with this on hands `esker-cli` and `esker-engine` a TLS-capable client without either
# manifest naming it. A *production* build of `esker-cli` alone still needs a forwarding feature
# in that crate — one line, `tls = ["esker-s3/tls"]` — which this lane does not own.
tls = ["dep:rustls", "dep:rustls-graviola"]

[dev-dependencies]
# The response parser is fed bytes we did not write, so it gets a property test that throws
# arbitrary ones at it (CLAUDE.md invariant 9). Dev-only, so the pure-Rust rule does not reach
# it and it costs nothing against the runtime budget.
proptest.workspace = true

[lints]
workspace = true
