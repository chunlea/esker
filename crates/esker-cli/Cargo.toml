[package]
name = "esker-cli"
description = "Esker command line tools: bootstrap, inspection and benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# `sst-dump` reads real tables through the engine's own reader, so the tool and the
# engine can never disagree about the format (docs/DESIGN.md §12).
esker-engine.workspace = true
# `bench` needs a seeded generator, and `CLAUDE.md` allows exactly one (`rand` is banned).
esker-base.workspace = true
# `raw` and `bench --remote` drive the network API through the client, so the tool exercises
# the same routing and retry code an application would (docs/DESIGN.md §10).
esker-client.workspace = true
# `bench --remote` hands key-value pairs to the client, whose API takes `Bytes`.
bytes.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
