[package]
name = "esker-cli"
description = "Esker command line tools: bootstrap, inspection and benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# RPC and S3 TLS, forwarded to the crates that implement them (ADR 0055). The PostgreSQL port
# is `esker-sql`'s own feature and this binary does not link that crate.
#
# Off by default. `just check` builds `--all-features`, so the gated paths are what CI compiles;
# this exists so that a *production* build of this binary alone can turn them on, which no
# amount of workspace feature unification does for you.
tls = ["esker-proto/tls", "esker-s3/tls"]

[dependencies]
# `sst-dump` reads real tables through the engine's own reader, so the tool and the
# engine can never disagree about the format (docs/DESIGN.md §12).
esker-engine.workspace = true
# `bench` needs a seeded generator, and `CLAUDE.md` allows exactly one (`rand` is banned).
esker-base.workspace = true
# `raw` and `bench --remote` drive the network API through the client, so the tool exercises
# the same routing and retry code an application would (docs/DESIGN.md §10).
esker-client.workspace = true
# `bench --remote` hands key-value pairs to the client, whose API takes `Bytes`.
bytes.workspace = true
# `server` opens a store and puts the wire in front of it.
esker-store.workspace = true
esker-proto.workspace = true
# `pd serve` puts the wire in front of a placement driver, and `pd inspect` reads the state
# it keeps in its own engine (docs/DESIGN.md §7).
esker-pd.workspace = true
# `bench --sst-store` opens the database on a tiered filesystem, which needs the S3 client to
# point it at (phase 6b, docs/bench/phase-6b.md).
esker-s3.workspace = true
# The runtime `server` runs on, and the ctrl-c it stops on. This is the only command that
# builds one: `raw` and `bench --remote` go through the client's blocking transport.
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "macros"] }

[dev-dependencies]
# `pd inspect`'s tests drive a clock by hand rather than sleeping, the same way `esker-pd`'s
# own tests do. Dev-only: the feature exposes a test clock and nothing else.
esker-pd = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# `raw` and `bench --remote` are tested against a real server on a real socket, because a mock
# would leave out exactly the layers those two commands exist to exercise. Dev-only.
esker-proto.workspace = true
esker-store.workspace = true
# `tests/cluster_chaos.rs` drives a cluster this binary started, from outside, and checks the
# history it produced. The client is how a real caller reaches it; the checker lives in
# `esker-sim` because DESIGN.md §11 puts it there for exactly this. Both dev-only.
esker-client.workspace = true
esker-sim.workspace = true
# `tests/tier_acceptance.rs` reads a store's engine directly to prove what *that node* holds,
# which means encoding a RawKv key the way the store does. Dev-only.
esker-keys.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
