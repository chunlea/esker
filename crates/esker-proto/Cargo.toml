[package]
name = "esker-proto"
description = "Esker wire protocol: hand-rolled framed RPC over TCP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# The checksum on every frame, and the varints every body is built from. Sharing them with
# the engine is why they live in `esker-base` (ADR 0004).
esker-base.workspace = true
# The Raft messages service 0x04 carries. The wire knows the shape of what it carries, as it
# already does for RawKv; a mirrored enum would drift silently (ADR 0009).
esker-raft.workspace = true
# `Bytes` at API boundaries: a frame body is split from the read buffer without a copy.
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The network edge, and the only place in the project where async appears (CLAUDE.md,
# "Toolchain and conventions"). Features are listed one by one: `net` and `io-util` for the
# sockets, `rt`/`rt-multi-thread` for the tasks a connection owns, `sync` for the bounded
# channels that are this crate's backpressure, `time` for the keepalive, `macros` for
# `#[tokio::test]` and `#[tokio::main]`. No `fs`, no `process`, no `signal` — the CLI adds
# `signal` for ctrl-c, which is the only place that needs it.
tokio = { workspace = true, features = [
    "net",
    "io-util",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }
# **Optional, and off by default** (`tls` below). The same two crates and the same provider the
# PostgreSQL port and the S3 tier took (ADR 0055); this is the third and last surface, so it costs
# nothing further against the budget. Contained to `src/transport/tls.rs`: a `use rustls::`
# anywhere else in this crate is a review failure.
rustls = { workspace = true, optional = true }
rustls-graviola = { workspace = true, optional = true }

[features]
# TLS on the framed RPC, and the shared session driver `esker-sql` uses for the PostgreSQL port.
#
# **Off by default.** With it off this crate links neither crate above, the runtime graph is what
# it was, and `RpcTls::from_files` is a startup error naming the feature rather than a node that
# comes up unencrypted on a port an operator believes is protected.
tls = ["dep:rustls", "dep:rustls-graviola"]

[dev-dependencies]
proptest.workspace = true
# The loopback test shuffles reply order with the project's own seeded generator; `rand` is
# banned (ADR 0004).
esker-base.workspace = true

[lints]
workspace = true
