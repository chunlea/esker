[package]
name = "esker-sql"
description = "Stateless PostgreSQL-speaking node: wire protocol, catalog, planner and executor over Esker transactions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
esker-base.workspace = true
# The transactional store this node reads and writes through. A workspace crate, so nothing on
# the dependency budget moves: its own dependencies are the ones this crate already has.
esker-client.workspace = true
esker-keys.workspace = true
# The wire types the client's constructors take (`TransportConfig`). Already in this crate's
# graph through esker-client; naming it here is what lets the binary build one.
esker-proto.workspace = true
# Contained to src/parse.rs by rule (docs/adr/0014-sqlparser.md); a `use sqlparser::`
# anywhere else in this crate is a review failure.
sqlparser.workspace = true
thiserror.workspace = true
# The socket edge only. The engine, the parser, the session state machine and every encoding in
# this crate are synchronous and `std`-only; `tokio` appears in `pgwire::server` and nowhere else.
tokio = { workspace = true, features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The end-to-end tests run the corpus against real stores over real sockets, which is the only
# way to prove the wiring rather than the fake.
esker-store.workspace = true
# `tests/joint_gate.rs` drives a **real** placement driver, because what it is about is the seam
# between three processes: a SQL node reports a columnar wish, PD schedules a learner for it, and
# a store builds one. A stand-in for any of the three would be a test of the stand-in. Nothing
# `esker-sql` ships links PD — they are peers that meet on the wire — so this is workspace-internal
# and dev-only: it adds nothing to the runtime graph or to `deny.toml`'s budget, and `esker-pd`
# does not depend on this crate, so there is no cycle. The same dependency `esker-store` and
# `esker-client` take, for the same reason.
esker-pd.workspace = true
proptest.workspace = true
sqllogictest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
