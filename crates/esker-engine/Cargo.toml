[package]
name = "esker-engine"
description = "Esker storage engine: WAL, memtable, SST, manifest, compaction, column families."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
esker-base.workspace = true
# The object-storage client behind `fs::tier` (ADR 0024, ADR 0025). A leaf crate like
# esker-base: no external dependency of its own, so this costs nothing against the budget in
# deny.toml, and it keeps the engine free of tokio -- `esker_s3::Transport` blocks.
esker-s3.workspace = true
# `Bytes` at API boundaries only; `&[u8]` internally (CLAUDE.md, "Toolchain and conventions").
bytes.workspace = true
# The only compression codec, pure Rust (DESIGN §4.5).
lz4_flex.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Exposes `esker_engine::testing`, the fault-injecting FileSystem the crash tests of
# DESIGN.md §11 need. Off by default: a normal build must not carry code whose job is to
# break things. Enable it from a dev-dependency, never from a runtime one.
testing = []

[[bench]]
name = "memtable"
harness = false
# Not a test target. `cargo test` runs bench targets by default, and a criterion binary in test
# mode is a slow no-op that `cargo nextest` cannot enumerate. `cargo clippy --all-targets` still
# lints it, which is the part that has to stay in the gate.
test = false

[dev-dependencies]
# ADR 0041's bench plan. Dev-only, so `deny.toml`'s `exclude-dev` keeps it off the runtime
# budget; CLAUDE.md's dev allowlist already names it.
criterion.workspace = true
# The crate's own test harness, enabled for its tests only. An integration test links the
# library as an ordinary dependency, so `#[cfg(test)]` does not reach it and the feature is
# the only way in (see src/testing/mod.rs).
esker-engine = { path = ".", features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
