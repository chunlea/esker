[package]
name = "esker-engine"
description = "Esker storage engine: WAL, memtable, SST, manifest, compaction, column families."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
esker-base.workspace = true
# `Bytes` at API boundaries only; `&[u8]` internally (CLAUDE.md, "Toolchain and conventions").
bytes.workspace = true
# The memtable, and the one piece of concurrent unsafe code we buy rather than write.
crossbeam-skiplist.workspace = true
# The only compression codec, pure Rust (DESIGN §4.5).
lz4_flex.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Exposes `esker_engine::testing`, the fault-injecting FileSystem the crash tests of
# DESIGN.md §11 need. Off by default: a normal build must not carry code whose job is to
# break things. Enable it from a dev-dependency, never from a runtime one.
testing = []

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
